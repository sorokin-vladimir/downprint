<!DOCTYPE html>
<!--
  Source of assets/social-preview.png (GitHub social preview, 1280x640).
  Regenerate:
    chromium --headless --hide-scrollbars --window-size=1280,640 \
      --screenshot=assets/social-preview.png assets/social-preview.html
-->
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --fg: #1f2328;
    --muted: #59636e;
    --border: #d1d9e0;
    --canvas: #f6f8fa;
    --accent: #0969da;
    --code-bg: #eff2f5;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    background: #fff;
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    padding: 0 64px;
    gap: 48px;
  }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }

  .text { flex: 1 1 0; }
  h1 {
    font-size: 88px;
    font-weight: 700;
    letter-spacing: -3px;
    line-height: 1;
  }
  h1 span { color: var(--accent); }
  .tagline {
    margin-top: 24px;
    font-size: 25px;
    line-height: 1.4;
    white-space: nowrap;
    color: var(--muted);
  }
  .install {
    display: inline-block;
    margin-top: 40px;
    padding: 14px 20px;
    font-size: 17px;
    white-space: nowrap;
    background: var(--canvas);
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  .install b { color: var(--accent); font-weight: 600; }

  .art {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 22px;
  }
  .card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(31, 35, 40, .10);
  }
  .src {
    width: 190px;
    padding: 20px 18px;
    background: var(--canvas);
    font-size: 14px;
    line-height: 1.75;
    color: var(--muted);
    white-space: pre;
  }
  .src .h { color: var(--fg); font-weight: 700; }
  .src .k { color: #cf222e; }
  .src .s { color: #0a3069; }

  .arrow { width: 44px; height: 24px; }

  .page {
    width: 230px;
    height: 320px;
    padding: 26px 24px;
    position: relative;
  }
  .page .title {
    font-size: 21px;
    font-weight: 700;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 14px;
  }
  .line { height: 8px; border-radius: 4px; background: #e6eaef; margin-bottom: 9px; }
  .bullet { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; }
  .bullet::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--muted); }
  .bullet .line { flex: 1; margin: 0; }
  .code {
    margin: 14px 0;
    padding: 10px 12px;
    background: var(--canvas);
    border-radius: 6px;
  }
  .code .line { height: 6px; margin-bottom: 7px; background: #d5dbe2; }
  .code .line:last-child { margin-bottom: 0; }
  .table { display: grid; grid-template-columns: 1fr 1fr 1fr; border: 1px solid var(--border); }
  .table div { height: 18px; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); }
  .table div:nth-child(3n) { border-right: 0; }
  .table div:nth-child(n+7) { border-bottom: 0; }
  .table div:nth-child(-n+3) { background: var(--canvas); }
  .badge {
    position: absolute;
    right: -12px;
    bottom: -12px;
    padding: 6px 12px;
    font-size: 15px;
    font-weight: 700;
    color: #fff;
    background: #cf222e;
    border-radius: 8px;
  }
</style>
</head>
<body>
  <div class="text">
    <h1>down<span>print</span></h1>
    <p class="tagline">Markdown to PDF with GitHub&#8209;like styling.<br>One Go binary, rendered by headless&nbsp;Chrome.</p>
    <div class="install mono"><b>brew install</b> sorokin-vladimir/tap/downprint</div>
  </div>

  <div class="art">
    <div class="card src mono"><span class="h"># Report</span>

- first item
- second item

<span class="k">```go</span>
<span class="s">fmt.Println("hi")</span>
<span class="k">```</span>

| a | b | c |</div>

    <svg class="arrow" viewBox="0 0 44 24" fill="none" stroke="#0969da" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 12h38M30 3l10 9-10 9"/>
    </svg>

    <div class="card page">
      <div class="title">Report</div>
      <div class="bullet"><div class="line" style="width:70%"></div></div>
      <div class="bullet"><div class="line" style="width:85%"></div></div>
      <div class="code">
        <div class="line" style="width:60%"></div>
        <div class="line" style="width:80%"></div>
        <div class="line" style="width:45%"></div>
      </div>
      <div class="table"><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div></div>
      <div class="line" style="margin-top:14px"></div>
      <div class="line" style="width:75%"></div>
      <div class="badge">PDF</div>
    </div>
  </div>
</body>
</html>
